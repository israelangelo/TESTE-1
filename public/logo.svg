<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200">
  <!-- Fundo azul royal -->
  <rect width="400" height="200" fill="#032774"/>
  
  <!-- BOX — grande, bold, laranja -->
  <text
    x="200"
    y="118"
    font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif"
    font-weight="900"
    font-size="110"
    fill="#E06820"
    text-anchor="middle"
    letter-spacing="8"
    dominant-baseline="auto"
  >BOX</text>
  
  <!-- Linha divisória fina -->
  <rect x="60" y="130" width="280" height="2" fill="#E06820" opacity="0.6"/>
  
  <!-- AGÊNCIA — pequeno, branco, espaçado -->
  <text
    x="200"
    y="158"
    font-family="'Barlow Condensed', 'Arial Narrow', Arial, sans-serif"
    font-weight="600"
    font-size="24"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="12"
    dominant-baseline="auto"
  >AGÊNCIA</text>
</svg>
